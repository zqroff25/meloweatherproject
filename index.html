      /* COMPLETELY HIDE SCROLLBARS */
      /* Chrome, Safari, Opera */
      ::-webkit-scrollbar {
        display: none;
        width: 0px;
        background: transparent;

      html, body {
        scrollbar-width: none; /* Firefox */

      /* Ensure modal content can still scroll but without visible bar */
      .overflow-y-auto {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

        display: none;
      }
    </style>
